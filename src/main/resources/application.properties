spring.application.name=campus-foodcourt

# ---------------------------------------------------------------------------
# Datasource - no defaults: the app refuses to start without explicit settings.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ---------------------------------------------------------------------------
# JPA - schema is owned by Flyway, Hibernate never changes it.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------------------------------------------------------------------------
# Flyway
# ---------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# Additional databases the application must never use (comma-separated).
# "campusfoodcourt" is always protected in code and cannot be removed here.
app.database.protected-names=${DB_PROTECTED_NAMES:}

# ---------------------------------------------------------------------------
# Authentication
# ---------------------------------------------------------------------------
# Base64-encoded HMAC key, at least 256 bits (32 bytes) after decoding. No default.
app.jwt.secret=${JWT_SECRET}
# Short-lived access token (default 15 minutes).
app.jwt.expiration-ms=${JWT_ACCESS_TOKEN_TTL_MS:900000}
# "iss" claim written into, and required from, every access token (docs/authentication.md).
app.jwt.issuer=campus-foodcourt
# Opaque, rotating refresh token with a rolling inactivity expiry (default 7 days): every successful
# refresh issues a successor valid for another full period. No absolute session lifetime.
app.auth.refresh-token-ttl=${REFRESH_TOKEN_TTL:P7D}
app.auth.bcrypt-strength=${BCRYPT_STRENGTH:12}
# Refresh token travels only in this HttpOnly cookie, scoped to the auth endpoints.
app.auth.cookie.name=refresh_token
app.auth.cookie.path=/api/auth
app.auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
app.auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Strict}

# ---------------------------------------------------------------------------
# Authentication rate limiting (per client address, per endpoint, in memory).
# Counters reset on restart and are NOT shared between instances. Clients behind one NAT/proxy address
# share a budget - raise the limits if many users reach the app through a single public IP.
# ---------------------------------------------------------------------------
app.auth.rate-limit.login.max-requests=${AUTH_RATE_LIMIT_LOGIN_MAX_REQUESTS:20}
app.auth.rate-limit.login.window=${AUTH_RATE_LIMIT_LOGIN_WINDOW:PT1M}
app.auth.rate-limit.register.max-requests=${AUTH_RATE_LIMIT_REGISTER_MAX_REQUESTS:20}
app.auth.rate-limit.register.window=${AUTH_RATE_LIMIT_REGISTER_WINDOW:PT10M}
app.auth.rate-limit.refresh.max-requests=${AUTH_RATE_LIMIT_REFRESH_MAX_REQUESTS:60}
app.auth.rate-limit.refresh.window=${AUTH_RATE_LIMIT_REFRESH_WINDOW:PT1M}
# Memory bound: distinct clients tracked per endpoint (about 200 bytes each).
app.auth.rate-limit.max-tracked-clients=${AUTH_RATE_LIMIT_MAX_TRACKED_CLIENTS:20000}
# IPv6 clients are grouped by this prefix length.
app.auth.rate-limit.ipv6-prefix-length=${AUTH_RATE_LIMIT_IPV6_PREFIX_LENGTH:64}
# The client address is the TCP peer address. X-Forwarded-For / Forwarded headers are never trusted
# (also not on auto-detected cloud platforms). Behind a reverse proxy see docs/authentication.md.
server.forward-headers-strategy=none

# ---------------------------------------------------------------------------
# Actuator / error output
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-stacktrace=never
server.error.include-message=never
#---
spring.config.activate.on-profile=!prod
# Second document (the "#---" separator must not be adjacent to comment lines):
# local secrets from a git-ignored .env file (KEY=VALUE) in the working directory.
# Imported in every profile EXCEPT prod; real environment variables take precedence.
spring.config.import=optional:file:${APP_ENV_FILE:.env}[.properties]
