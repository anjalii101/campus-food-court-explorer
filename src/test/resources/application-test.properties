# Test profile. The datasource is supplied at runtime by AbstractIntegrationTest
# (embedded throwaway PostgreSQL), never a locally installed database.
# Test-only key: decodes to the ASCII text "test-only-jwt-signing-key-not-for-real-use-0123456789".
app.jwt.secret=dGVzdC1vbmx5LWp3dC1zaWduaW5nLWtleS1ub3QtZm9yLXJlYWwtdXNlLTAxMjM0NTY3ODk=
# Access-token and refresh-token lifetimes are deliberately NOT overridden here, so tests
# exercise the production defaults (15 minutes / 7 days) from application.properties.
app.auth.bcrypt-strength=10
app.database.protected-names=campusfoodcourt
# All MockMvc requests share the client address 127.0.0.1 and one cached context, so the general suite runs
# with effectively unlimited budgets. Rate limiting itself is tested in AuthRateLimitIntegrationTest (own
# small limits) and the production defaults are asserted by AuthRateLimitPropertiesTest.
app.auth.rate-limit.login.max-requests=1000000
app.auth.rate-limit.register.max-requests=1000000
app.auth.rate-limit.refresh.max-requests=1000000
